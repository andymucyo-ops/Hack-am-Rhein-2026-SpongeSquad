<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product stage · SpongeSquad</title>
  <style>
    :root{--ink:#17251f;--soft:#596860;--paper:#f4f2eb;--white:#fffefa;--green:#24543f;--lime:#d9ef70;--amber:#d9ac56;--line:#d9ddd7;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper)}main{min-height:100vh;display:grid;grid-template-columns:1.2fr .8fr}.copy,.boundary{padding:clamp(30px,7vw,90px);display:flex;flex-direction:column;justify-content:center}.copy{background:var(--white)}.boundary{color:#dce9e0;background:#1b3127}.eyebrow{color:#3e765b;font:700 11px/1.4 "SFMono-Regular",Consolas,monospace;letter-spacing:.1em;text-transform:uppercase}.boundary .eyebrow{color:var(--amber)}h1{margin:18px 0 12px;font-size:clamp(42px,7vw,78px);line-height:.98;letter-spacing:-.05em}.question{color:var(--green);font-size:20px;font-weight:720}.contribution,.limit{font-size:17px;line-height:1.6}.contribution{max-width:740px;color:var(--soft)}.boundary h2{color:white;font-size:clamp(26px,3vw,38px);line-height:1.15}.limit{color:#cad9d0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.button{padding:13px 15px;border:1px solid var(--line);border-radius:9px;color:var(--green);background:var(--white);font-size:13px;font-weight:760;text-decoration:none}.boundary .button{color:#13231b;background:var(--lime);border-color:var(--lime)}@media(max-width:760px){main{grid-template-columns:1fr}.copy,.boundary{min-height:50vh}}
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <p class="eyebrow" id="meta">Product stage</p>
      <h1 id="tool">Loading…</h1>
      <p class="question" id="question"></p>
      <p class="contribution" id="contribution"></p>
      <div class="actions"><a class="button" href="./">← Product overview</a><a class="button" id="artifact" href="#">Open available artefact ↗</a></div>
    </section>
    <aside class="boundary">
      <p class="eyebrow">Evidence boundary</p>
      <h2 id="boundary"></h2>
      <p class="limit">This stage is part of the product journey even when its richer generated module is unavailable in branch-based GitHub Pages.</p>
    </aside>
  </main>
  <script>
    (async function(){
      const id=(location.hash||('#'+new URLSearchParams(location.search).get('view'))||'#classify').slice(1);
      const manifest=await fetch('data/product-manifest.json').then(r=>r.json());
      const stage=manifest.stages.find(item=>item.id===id)||manifest.stages[0];
      document.title=stage.tool+' · SpongeSquad';
      document.getElementById('meta').textContent=stage.number+' · '+stage.verb+' · '+stage.owner;
      document.getElementById('tool').textContent=stage.tool;
      document.getElementById('question').textContent=stage.question;
      document.getElementById('contribution').textContent=stage.contribution;
      document.getElementById('boundary').textContent=stage.boundary;
      const link=document.getElementById('artifact');
      link.href=stage.artifactUrl||stage.url;
      if(!stage.artifactUrl) link.hidden=true;
    })().catch(()=>{document.getElementById('tool').textContent='Stage unavailable';});
  </script>
</body>
</html>
