<!doctype html>
<html lang="en" data-root="../" data-section="view">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SpongeSquad module viewer with a return path to the website." />
  <title>Module · SpongeSquad</title>
  <link rel="stylesheet" href="../assets/site.css" />
